[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "player-check-roster"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1.1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
player-check-roster = "player_check_roster.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]