name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem == 'npm' || steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          if gh pr merge --auto --squash "$PR_URL"; then
            echo "Auto-merge enabled for $PR_URL"
            exit 0
          fi

          echo "Auto-merge is unavailable for this repository/branch."
          echo "Enable 'Allow auto-merge' and add branch protection rules if you want queued auto-merge."
          echo "Skipping failure so this workflow does not error."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
